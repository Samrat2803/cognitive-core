<html>
    <head>
        <meta charset="utf-8">
        
            <script src="lib/bindings/utils.js"></script>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/dist/vis-network.min.css" integrity="sha512-WgxfT5LWjfszlPHXRmBWHkV2eceiWTOBvrKCNbdgDYTHrT2AeLCGbF4sZlZw3UMN3WtL0tGUoIAKsu8mllg/XA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
            <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js" integrity="sha512-LnvoEWDFrqGHlHmDD2101OrLcbsfkrzoSpvtSQtxK3RMnRV0eOkhhBN2dXHKRrUU8p2DGRTk35n4O8nWSVe1mQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
            
                <link href="lib/tom-select/tom-select.css" rel="stylesheet">
                <script src="lib/tom-select/tom-select.complete.min.js"></script>
            
        
<center>
<h1></h1>
</center>

<!-- <link rel="stylesheet" href="../node_modules/vis/dist/vis.min.css" type="text/css" />
<script type="text/javascript" src="../node_modules/vis/dist/vis.js"> </script>-->
        <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6"
          crossorigin="anonymous"
        />
        <script
          src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf"

        ></script>


        <center>
          <h1></h1>
        </center>
        <style type="text/css">

             #mynetwork {
                 width: 100%;
                 height: 750px;
                 background-color: #1a1a1a;
                 border: 1px solid lightgray;
                 position: relative;
                 float: left;
             }

             

             

             
        </style>
    </head>


    <body>
        <div class="card" style="width: 100%">
            
                <div id="select-menu" class="card-header">
                    <div class="row no-gutters">
                        <div class="col-10 pb-2">
                            <select
                            class="form-select"
                            aria-label="Default select example"
                            onchange="selectNode([value]);"
                            id="select-node"
                            placeholder="Select node..."
                            >
                                <option selected>Select a Node by ID</option>
                                
                                    <option value="Maiden Pharmaceuticals">Maiden Pharmaceuticals</option>
                                
                                    <option value="Diethylene Glycol (DEG)">Diethylene Glycol (DEG)</option>
                                
                                    <option value="Central Drugs Standard Control Organisation (CDSCO)">Central Drugs Standard Control Organisation (CDSCO)</option>
                                
                                    <option value="World Health Organization (WHO)">World Health Organization (WHO)</option>
                                
                                    <option value="Gambia">Gambia</option>
                                
                                    <option value="Uzbekistan">Uzbekistan</option>
                                
                                    <option value="Dr. Rajeev Singh Raghuvanshi">Dr. Rajeev Singh Raghuvanshi</option>
                                
                                    <option value="Marion Biotech">Marion Biotech</option>
                                
                                    <option value="Propylene Glycol">Propylene Glycol</option>
                                
                            </select>
                        </div>
                        <div class="col-2 pb-2">
                            <button type="button" class="btn btn-primary btn-block" onclick="neighbourhoodHighlight({nodes: []});">Reset Selection</button>
                        </div>
                    </div>
                </div>
            
            
              <div id="filter-menu" class="card-header">
                <div class="row no-gutters">
                  <div class="col-3 pb-2">
                    <select
                            class="form-select"
                            aria-label="Default select example"
                            onchange="updateFilter(value, 'item')"
                            id="select-item"
                        >
                        <option value="">Select a network item</option>
                        <option value="edge">edge</option>
                        <option value="node">node</option>
                    </select>
                  </div>
                  <div class="col-3 pb-2">
                    <select
                            class="form-select"
                            aria-label="Default select example"
                            onchange="updateFilter(value, 'property')"
                            id="select-property"
                        >
                        <option value="">Select a property...</option>
                    </select>
                  </div>
                  <div class="col-3 pb-2">
                    <select
                            class="form-select"
                            aria-label="Default select example"
                            id="select-value"
                        >
                        <option value="">Select value(s)...</option>
                    </select>
                  </div>
                  <div class="col-1 pb-2">
                    <button type="button" class="btn btn-primary btn-block" onclick="highlightFilter(filter);">Filter</button>
                  </div>
                  <div class="col-2 pb-2">
                    <button type="button" class="btn btn-primary btn-block" onclick="clearFilter(true)">Reset Selection</button>
                  </div>
                </div>
              </div>
            
            <div id="mynetwork" class="card-body"></div>
        </div>

        
        

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              
                  new TomSelect("#select-node",{
                      create: false,
                      sortField: {
                          field: "text",
                          direction: "asc"
                      }
                  });
              

              
                  // explicitly using onItemAdd and this function as we need to save multiple values
                  let updateValueFilter = function() {
                      return function () {
                      filter['value'].push(arguments[0])
                      }
                  }

                  let valueControl = new TomSelect("#select-value",{
                      maxItems: null,
                      valueField: 'id',
                      labelField: 'title',
                      searchField: 'title',
                      create: false,
                      sortField: {
                          field: "text",
                          direction: "asc"
                      },
                      onItemAdd: updateValueFilter()
                  });

                  let addValues = function() {
                      return function () {
                          // clear the current value options and add the selected attribute values
                          // tom-select handles duplicates
                          let selectedProperty = arguments[0];
                          valueControl.clear();
                          valueControl.clearOptions();
                          filter['value'] = []
                          if (filter['item'] === 'node') {
                              for (let each in allNodes) {
                                  valueControl.addOption({
                                      id:allNodes[each][selectedProperty],
                                      title:allNodes[each][selectedProperty]
                                  })
                              }
                          }
                          else if (filter['item'] === 'edge') {
                              for (let each in allEdges) {
                                  valueControl.addOption({
                                      id:allEdges[each][selectedProperty],
                                      title:allEdges[each][selectedProperty]
                                  })
                              }
                          }
                      }
                  };

                  let propControl = new TomSelect("#select-property",{
                      valueField: 'id',
                      labelField: 'title',
                      searchField: 'title',
                      create: false,
                      sortField: {
                          field: "text",
                          direction: "asc"
                      },
                      onItemAdd: addValues()
                  });

                  let addProperties = function() {
                      return function () {
                          // loops through the selected network item and adds the attributes to dropdown
                          // tom-select handles duplicates
                          clearFilter(false)
                          if (arguments[0] === 'edge') {
                              for (let each in allEdges) {
                                  if (allEdges.hasOwnProperty(each)) {
                                      for (let eachProp in allEdges[each]) {
                                          if (allEdges[each].hasOwnProperty(eachProp)) {
                                              propControl.addOption({id: eachProp, title: eachProp})
                                          }
                                      }
                                  }
                              }
                          }
                          else if (arguments[0] === 'node') {
                              for (let each in allNodes) {
                                  if (allNodes.hasOwnProperty(each)) {
                                      for (let eachProp in allNodes[each]) {
                                          if (allNodes[each].hasOwnProperty(eachProp)
                                              && (eachProp !== 'hidden' && eachProp !== 'savedLabel'
                                                  && eachProp !== 'hiddenLabel')) {
                                              propControl.addOption({id: eachProp, title: eachProp})

                                          }
                                      }
                                  }
                              }
                          }
                      }
                  };

                  let itemControl = new TomSelect("#select-item",{
                      create: false,
                      sortField:{
                          field: "text",
                          direction: "asc"
                      },
                      onItemAdd: addProperties()
                  });

                  function clearFilter(reset) {
                      // utility function to clear all the selected filter options
                      // if reset is set to true, the existing filter will be removed
                      // else, only the dropdown options are cleared
                      propControl.clear();
                      propControl.clearOptions();
                      valueControl.clear();
                      valueControl.clearOptions();
                      filter = {
                          item : '',
                          property : '',
                          value : []
                      }
                      if (reset) {
                          itemControl.clear();
                          filterHighlight({nodes: []})
                      }
                  }

                  function updateFilter(value, key) {
                      // key could be 'item' or 'property' and value is as selected in dropdown
                      filter[key] = value
                  }

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"borderWidth": 3, "borderWidthSelected": 5, "color": "#5d535c", "font": {"color": "white"}, "id": "Maiden Pharmaceuticals", "label": "Maiden Pharmaceuticals", "shape": "dot", "size": 48.0, "title": "\u003cb\u003eMaiden Pharmaceuticals\u003c/b\u003e\u003cbr\u003eType: organization\u003cbr\u003eRole: Manufacturer of contaminated cough syrups\u003cbr\u003eImportance: 0.95\u003cbr\u003eInvestigated: True"}, {"borderWidth": 3, "borderWidthSelected": 5, "color": "#FF6B6B", "font": {"color": "white"}, "id": "Diethylene Glycol (DEG)", "label": "Diethylene Glycol (DEG)", "shape": "dot", "size": 46.0, "title": "\u003cb\u003eDiethylene Glycol (DEG)\u003c/b\u003e\u003cbr\u003eType: substance\u003cbr\u003eRole: Toxic contaminant found in syrups\u003cbr\u003eImportance: 0.90\u003cbr\u003eInvestigated: True"}, {"borderWidth": 3, "borderWidthSelected": 5, "color": "#5d535c", "font": {"color": "white"}, "id": "Central Drugs Standard Control Organisation (CDSCO)", "label": "Central Drugs Standard Control Organisation (CDSCO)", "shape": "dot", "size": 44.0, "title": "\u003cb\u003eCentral Drugs Standard Control Organisation (CDSCO)\u003c/b\u003e\u003cbr\u003eType: organization\u003cbr\u003eRole: Indian drug regulatory authority\u003cbr\u003eImportance: 0.85\u003cbr\u003eInvestigated: True"}, {"borderWidth": 3, "borderWidthSelected": 5, "color": "#5d535c", "font": {"color": "white"}, "id": "World Health Organization (WHO)", "label": "World Health Organization (WHO)", "shape": "dot", "size": 42.0, "title": "\u003cb\u003eWorld Health Organization (WHO)\u003c/b\u003e\u003cbr\u003eType: organization\u003cbr\u003eRole: Issued global alert on contaminated products\u003cbr\u003eImportance: 0.80\u003cbr\u003eInvestigated: True"}, {"borderWidth": 3, "borderWidthSelected": 5, "color": "#333333", "font": {"color": "white"}, "id": "Gambia", "label": "Gambia", "shape": "dot", "size": 45.2, "title": "\u003cb\u003eGambia\u003c/b\u003e\u003cbr\u003eType: location\u003cbr\u003eRole: Country where 70 children died\u003cbr\u003eImportance: 0.88\u003cbr\u003eInvestigated: True"}, {"borderWidth": 3, "borderWidthSelected": 5, "color": "#333333", "font": {"color": "white"}, "id": "Uzbekistan", "label": "Uzbekistan", "shape": "dot", "size": 40.0, "title": "\u003cb\u003eUzbekistan\u003c/b\u003e\u003cbr\u003eType: location\u003cbr\u003eRole: Country with 18 deaths reported\u003cbr\u003eImportance: 0.75\u003cbr\u003eInvestigated: True"}, {"borderWidth": 1, "borderWidthSelected": 5, "color": "#d9f378", "font": {"color": "white"}, "id": "Dr. Rajeev Singh Raghuvanshi", "label": "Dr. Rajeev Singh Raghuvanshi", "shape": "dot", "size": 38.0, "title": "\u003cb\u003eDr. Rajeev Singh Raghuvanshi\u003c/b\u003e\u003cbr\u003eType: person\u003cbr\u003eRole: Drug Controller General of India\u003cbr\u003eImportance: 0.70\u003cbr\u003eInvestigated: False"}, {"borderWidth": 3, "borderWidthSelected": 5, "color": "#5d535c", "font": {"color": "white"}, "id": "Marion Biotech", "label": "Marion Biotech", "shape": "dot", "size": 42.8, "title": "\u003cb\u003eMarion Biotech\u003c/b\u003e\u003cbr\u003eType: organization\u003cbr\u003eRole: Manufacturer linked to Uzbekistan deaths\u003cbr\u003eImportance: 0.82\u003cbr\u003eInvestigated: True"}, {"borderWidth": 3, "borderWidthSelected": 5, "color": "#FF6B6B", "font": {"color": "white"}, "id": "Propylene Glycol", "label": "Propylene Glycol", "shape": "dot", "size": 36.0, "title": "\u003cb\u003ePropylene Glycol\u003c/b\u003e\u003cbr\u003eType: substance\u003cbr\u003eRole: Safe ingredient that should have been used\u003cbr\u003eImportance: 0.65\u003cbr\u003eInvestigated: True"}]);
                  edges = new vis.DataSet([{"color": "#666666", "from": "Maiden Pharmaceuticals", "title": "manufactured products containing", "to": "Diethylene Glycol (DEG)", "width": 2}, {"color": "#666666", "from": "Maiden Pharmaceuticals", "title": "exported contaminated products to", "to": "Gambia", "width": 2}, {"color": "#666666", "from": "Marion Biotech", "title": "exported contaminated products to", "to": "Uzbekistan", "width": 2}, {"color": "#666666", "from": "Diethylene Glycol (DEG)", "title": "substituted for (should have been)", "to": "Propylene Glycol", "width": 2}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"physics": {"forceAtlas2Based": {"gravitationalConstant": -50, "centralGravity": 0.01, "springLength": 100, "springConstant": 0.08}, "maxVelocity": 50, "solver": "forceAtlas2Based", "timestep": 0.35, "stabilization": {"iterations": 150}}, "nodes": {"font": {"size": 14}}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  
                    network.on("selectNode", neighbourhoodHighlight);
                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>
    </body>
</html>
